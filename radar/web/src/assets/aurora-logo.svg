<svg version="1.1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B0000"/>
      <stop offset="40%" stop-color="#B22222"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>
    <linearGradient id="aurora-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D32F2F" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5252" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer glowing ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="url(#aurora-glow)" stroke-width="2" opacity="0.4"/>
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#aurora-grad)" stroke-width="3" filter="url(#glow)"/>
  <!-- Stylized A letter -->
  <g filter="url(#glow)">
    <path d="M100 40 L55 160 L75 160 L85 130 L115 130 L125 160 L145 160 L100 40 Z M90 110 L110 110 L100 75 L90 110 Z" fill="url(#aurora-grad)"/>
  </g>
  <!-- Crosshair target center -->
  <circle cx="100" cy="100" r="5" fill="#FF1744" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="2" fill="#FFFFFF"/>
</svg>