<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#8b0000">
    <meta name="description" content="Aurora — Tactical Radar System for Counter-Strike 2. Dark red themed external radar.">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238B0000'/%3E%3Cstop offset='100%25' stop-color='%23FF1744'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='none' stroke='url(%23g)' stroke-width='3'/%3E%3Cpath d='M32 12 L14 52 h7 l4-10 h14 l4 10 h7 L32 12 z M28 38 h8 l-4-14 z' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='2.5' fill='%23FF1744'/%3E%3C/svg%3E">
    <style>
        html, body { background: #0a0000; }
        /* initial loading splash */
        #aurora-boot {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 9999;
            background: radial-gradient(ellipse at center, #1e0808 0%, #0a0000 70%);
            color: #ff5252; font-family: 'Roboto', sans-serif; letter-spacing: 6px;
            text-transform: uppercase; font-weight: 700; font-size: 1.6rem;
            text-shadow: 0 0 30px rgba(255,23,68,0.6);
            transition: opacity .5s ease;
        }
        #aurora-boot .dot {
            width: 64px; height: 64px; border-radius: 50%;
            border: 2px solid rgba(255,23,68,0.25); border-top-color: #ff1744;
            animation: a-spin 1s linear infinite; margin-bottom: 20px;
        }
        @keyframes a-spin { to { transform: rotate(360deg); } }
        #aurora-boot.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="aurora-boot">
        <div class="dot"></div>
        AURORA
    </div>
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                var el = document.getElementById('aurora-boot');
                if (el) { el.classList.add('hidden'); setTimeout(() => el.remove(), 600); }
            }, 400);
        });
    </script>
</body>
</html>
